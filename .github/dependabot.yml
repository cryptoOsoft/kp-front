version: 2
updates:
  # Frontend (pnpm)
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # jsdom from 30.1 on breaks maplibre-gl at import in vitest («reading '_buffer'» on the worker
    # Blob): MapView, mapTwist and the IncidentWorkspace harness fail to load (05.10.2026).
    # MapLibre 6 did not fix it: jsdom 31.0.0 on maplibre-gl 6.14 still fails that way, plus five
    # JournalComposer cases (#557, 08.11.2026). Held on 30.0.x with no upper bound, so no later
    # release is proposed again; lifting the hold is a deliberate PR that removes this rule.
    ignore:
      - dependency-name: jsdom
        versions: [">= 30.1.0"]
    groups:
      # Keep noise down: batch non-major bumps into one PR.
      minor-and-patch:
        update-types: [minor, patch]

  # Backend (uv / pip-compatible)
  - package-ecosystem: pip
    directory: "/backend"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    # codeql-action/init and /analyze must be the SAME version: proposed as two PRs (13.09.2026),
    # each failed CodeQL against the other's old half and neither could ever go green.
    groups:
      codeql:
        patterns:
          - "github/codeql-action/*"

  # Base images. Added after Node 20 sat three months past its 2026-04-30 end-of-life in the
  # Dockerfile's build stage without anything proposing the bump: npm, pip and actions were
  # all watched, and the one dependency a station actually RUNS was not.
  - package-ecosystem: docker
    directory: "/"
    # Node 25 is end-of-life; keep updates on the supported Node 24 LTS line.
    # ⚠️ The docker ecosystem takes no range here: «>=25.0.0 <26.0.0» made the WHOLE file
    # invalid, so Dependabot read none of it (found 20.09.2026). `25.x` is the form it accepts.
    ignore:
      - dependency-name: node
        versions: ["25.x"]
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
