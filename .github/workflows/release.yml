name: Release

# Pushing a v* tag publishes a release. The tag is expected to sit on a main commit whose CI
# was already green – but the full gate runs again here anyway, because a published image is
# the one artifact a strange station downloads without reading the diff.
#
#   just release 0.3.0 && just release-tag 0.3.0 && git push --follow-tags
#
# NOTE (one-time, after the first run): GHCR packages start PRIVATE even on a public repo.
# Set the package to public under Packages → kp-front → Package settings → Change visibility,
# or `docker pull` fails for everyone else.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # The same required checks as a normal push, including the shared image's isolated browser,
  # visual and performance stacks. Publishing still waits for the whole gate.
  gate:
    name: CI gate
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish image + GitHub Release
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the GitHub Release
      packages: write   # push to GHCR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0   # release.py's tag comparison needs the full tag list

      # The tag is the source of truth for the version; the committed files must agree with
      # it, or a mistyped tag would publish an image whose /api/system reports another number.
      - name: Resolve and verify the version
        id: v
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          case "$version" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "tag $GITHUB_REF_NAME is not vMAJOR.MINOR.PATCH"; exit 1 ;;
          esac
          pkg=$(python3 -c 'import json;print(json.load(open("package.json"))["version"])')
          if [ "$pkg" != "$version" ]; then
            echo "tag says $version but package.json says $pkg – run 'just release $version' first"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

          # Only move `latest` when this really is the newest release – a late patch on an
          # older series (0.1.1 after 0.2.0) must not drag `latest` backwards.
          image="ghcr.io/${GITHUB_REPOSITORY}"
          newest=$(git tag -l 'v*' | sort -V | tail -1)
          tags="${image}:${version}"$'\n'"${image}:${version%.*}"
          if [ "$newest" = "$GITHUB_REF_NAME" ]; then
            tags="$tags"$'\n'"${image}:latest"
          else
            echo "::notice::$GITHUB_REF_NAME is older than $newest – not moving 'latest'"
          fi
          {
            echo "tags<<TAGS_EOF"
            echo "$tags"
            echo "TAGS_EOF"
          } >> "$GITHUB_OUTPUT"

      # Fails the release if the version has no notes, rather than publishing an empty one.
      - name: Extract the release notes
        run: python3 scripts/changelog_section.py "${{ steps.v.outputs.version }}" > RELEASE_NOTES.md

      # Must precede Buildx: it registers the binfmt handlers the arm64 stage runs under.
      - name: Set up QEMU (arm64 emulation for the runtime stage)
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        with:
          platforms: arm64
          # tonistiigi/binfmt from Google's Docker Hub cache (same digest), not Hub itself.
          image: mirror.gcr.io/tonistiigi/binfmt:latest

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          # Buildx's own BuildKit container is moby/buildkit from Docker Hub unless named here, and
          # Hub's anonymous pull limit failed this step at random (09.10.2026). mirror.gcr.io is
          # Google's cache of Docker Hub: the same image, same digest.
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
          # The Dockerfile's base is named on Docker Hub (so Dependabot can read it); BuildKit
          # asks Google's Hub mirror first (same digests) and falls back to Hub itself.
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The build moment, stamped once here so both architectures of the manifest report the
      # same `built_at` (it lands as the BUILD_TIME build arg – see Settings.build).
      - name: Stamp the build time
        id: stamp
        run: echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # amd64 for the typical station VPS, arm64 so an ARM host (Hetzner CAX, Oracle Ampere,
      # a Pi 5) is a real option too. Both are wheel installs, not source builds: pypdfium2
      # and resvg-py publish manylinux aarch64 wheels, so nothing compiles under emulation.
      # The Vite stage is pinned to $BUILDPLATFORM in the Dockerfile, which keeps the only
      # genuinely slow step native.
      - name: Build and push the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          # Same context the gate just built, so this is mostly a cache replay.
          cache-from: |
            type=gha,scope=ci-amd64
            type=gha
          cache-to: type=gha,mode=max
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ steps.stamp.outputs.built_at }}
          tags: ${{ steps.v.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later
            org.opencontainers.image.description=KP Front – Einsatzführungs-app for frontline fire-service command

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          {
            echo "**Image:** \`ghcr.io/${{ github.repository }}:${{ steps.v.outputs.version }}\`"
            echo " · **Update:** \`docker compose pull && docker compose up -d\`"
            echo " · **New deployment:** [docs/DEPLOYMENT.md](https://github.com/${{ github.repository }}/blob/${GITHUB_REF_NAME}/docs/DEPLOYMENT.md)"
            echo
            echo "Migrations run automatically on boot, after an automatic pre-migration dump."
            echo
            echo "---"
            echo
            cat RELEASE_NOTES.md
          } > BODY.md
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file BODY.md \
            --verify-tag
